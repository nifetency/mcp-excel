[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-excel"
version = "1.0.0"
description = "Turn any Google Sheet into a CRM (leads, organizations, contacts, activities) from MCP clients"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
ocr = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0.0"]

[project.urls]
Homepage = "https://nife.io"
Repository = "https://github.com/nifetency/mcp-excel"
